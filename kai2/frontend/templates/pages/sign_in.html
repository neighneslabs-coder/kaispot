<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; KAISPOT</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/kaispot.css') }}">
<link rel="icon" href="data:,">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px">
<div style="width:100%;max-width:370px">
  <div style="text-align:center;margin-bottom:20px">
    <div style="font-size:1.5rem;font-weight:700;letter-spacing:.18em">KAISPOT</div>
    <div class="eyebrow" style="margin-top:4px">Voucher management</div>
  </div>
  <div class="card">
    <div class="card-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      <form method="post">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" value="{{ username }}"
                 autocomplete="username" autocapitalize="off" autofocus required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn wide big">Sign in</button>
      </form>
    </div>
  </div>
  <p class="small muted" style="text-align:center">On the office network only.</p>
</div>
</body>
</html>
